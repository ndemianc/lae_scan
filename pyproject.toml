[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eox-scan"
version = "0.1.0"
description = "Lifecycle-attributable exposure scanner: a PHP proof of concept validated on PHP2Shell"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Sergey Demianchuk"}]
dependencies = [
  "univers==32.0.1",
  "packageurl-python==0.17.6",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
]

[project.optional-dependencies]
schema = ["jsonschema>=4.18"]
dev = ["pytest>=7"]

[project.scripts]
eox-scan = "eox_scan.cli:main"

[project.urls]
Repository = "https://github.com/ndemianc/eox-scan"

[tool.setuptools.packages.find]
include = ["eox_scan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
